- name: "🔗 Criar upload URL para importação"
  ansible.builtin.command:
    argv:
      - aws
      - lexv2-models
      - create-upload-url
      - --region
      - "{{ region }}"
  register: upload_result
  changed_when: false
  tags: import_bot
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_access_key }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_secret_key }}"
    AWS_SESSION_TOKEN: "{{ aws_session_token }}"

- name: "📥 Extrair importId e uploadUrl"
  ansible.builtin.set_fact:
    import_id: "{{ (upload_result.stdout | from_json).importId }}"
    upload_url: "{{ (upload_result.stdout | from_json).uploadUrl }}"
  tags: import_bot

- name: "📤 Enviar arquivo zip para URL pré-assinada"
  ansible.builtin.shell: >
    curl -sS -X PUT "{{ upload_url }}"
    -H "Content-Type: application/zip"
    --upload-file "{{ bot_export_path }}"
  register: upload_curl
  changed_when: true
  failed_when: upload_curl.rc != 0
  tags: import_bot

- name: "📦 Montar JSON de especificação do bot (to_json)"
  ansible.builtin.set_fact:
    bot_specification_json: >-
      {{
        {
          "botImportSpecification": {
            "botName": bot_import_name,
            "roleArn": dest_role_bot_arn,
            "dataPrivacy": { "childDirected": false },
            "idleSessionTTLInSeconds": 300
          }
        } | to_json
      }}
  tags: import_bot

- name: "🚀 Iniciar importação do bot"
  ansible.builtin.command:
    argv:
      - aws
      - lexv2-models
      - start-import
      - --import-id
      - "{{ import_id }}"
      - --resource-specification
      - "{{ bot_specification_json }}"
      - --merge-strategy
      - FailOnConflict
      - --region
      - "{{ region }}"
  register: import_start
  changed_when: true
  tags: import_bot
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_access_key }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_secret_key }}"
    AWS_SESSION_TOKEN: "{{ aws_session_token }}"

# Poll até Completed; falha explícita para estados inválidos
- name: "⏳ Aguardar conclusão da importação"
  ansible.builtin.command:
    argv:
      - aws
      - lexv2-models
      - describe-import
      - --import-id
      - "{{ import_id }}"
      - --region
      - "{{ region }}"
      - --query
      - importStatus
      - --output
      - text
  register: import_status
  retries: 60
  delay: 5
  until: import_status.stdout in ["Completed", "Failed", "Deleting", "Deleted"]
  failed_when: import_status.stdout in ["Failed", "Deleting", "Deleted"] or import_status.rc != 0
  changed_when: false
  tags: import_bot
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_access_key }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_secret_key }}"
    AWS_SESSION_TOKEN: "{{ aws_session_token }}"

- name: "✅ Importação concluída"
  ansible.builtin.debug:
    msg: "✅ Importação concluída com status: {{ import_status.stdout }}"
  when: import_status.stdout == "Completed"
  tags: import_bot

- name: "❌ Motivo da falha na importação"
  ansible.builtin.command:
    argv:
      - aws
      - lexv2-models
      - describe-import
      - --import-id
      - "{{ import_id }}"
      - --region
      - "{{ region }}"
      - --query
      - 'failureReasons'
      - --output
      - text
  when: import_status.stdout == "Failed"
  register: failure_reason
  changed_when: false
  tags: import_bot
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_access_key }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_secret_key }}"
    AWS_SESSION_TOKEN: "{{ aws_session_token }}"

- name: "🛑 Mostrar motivo da falha"
  ansible.builtin.debug:
    msg: "Importação falhou: {{ failure_reason.stdout }}"
  when: import_status.stdout == "Failed"
  tags: import_bot
