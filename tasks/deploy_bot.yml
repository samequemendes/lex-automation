- name: Verificar se o Terraform já está instalado
  ansible.builtin.command: terraform --version
  register: terraform_version
  ignore_errors: yes

- name: Informar que o Terraform já está instalado
  ansible.builtin.debug:
    msg: "Terraform já está instalado: {{ terraform_version.stdout_lines[0] }}"
  when: terraform_version.rc == 0

- name: Informar que o Terraform não está instalado e iniciar download
  ansible.builtin.debug:
    msg: "Terraform não está instalado. Iniciando download e instalação..."
  when: terraform_version.rc != 0

- name: Instalar Terraform se não existir
  ansible.builtin.shell: |
    curl -fsSL https://releases.hashicorp.com/terraform/1.6.6/terraform_1.6.6_linux_amd64.zip -o terraform.zip
    unzip terraform.zip
    mv terraform /usr/local/bin/
  when: terraform_version.rc != 0

- name: "Clonar repositório do Terraform"
  ansible.builtin.git:
    repo: "{{ terraform_repo_url }}"
    dest: ./terraform/
    version: main
  tags: git

- name: "Atualiza valores do TFVARS"
  ansible.builtin.template:
    src: templates/terraform.tfvars.j2
    dest: ./terraform/terraform.tfvars
  tags: tfvars

- name: Define configurações de backend do Terraform
  ansible.builtin.template:
    src: templates/backend.tf.j2
    dest: ./terraform/backend.tf
  tags: backend
  
- name: Inicializar Terraform
  ansible.builtin.command:
    cmd: terraform init
    chdir: "{{ terraform_dir }}"
  tags: terraform_init

- name: 📦 Executar Terraform Plan sem ANSI
  ansible.builtin.shell: |
    TF_IN_AUTOMATION=true terraform plan -var-file=terraform.tfvars
  args:
    chdir: "{{ terraform_dir }}"
  register: terraform_plan_result
  ignore_errors: true
  tags: terraform_plan

- name: 📄 Mostrar STDOUT (resultado do plan)
  debug:
    var: terraform_plan_result.stdout_lines
  tags: terraform_plan

- name: ❌ Mostrar STDERR (caso erro)
  debug:
    var: terraform_plan_result.stderr_lines
  when: terraform_plan_result.rc != 0
  tags: terraform_plan

