# Configuration variables for Terraform automation with Amazon Lex
# Configurações para AWS
project_name: "amazon-lex-automation"
environment: "hml"
region: "us-east-1"
aws_assume_role_arn: "arn:aws:iam::743065069150:role/CrossAccountMasterRole"
dest_aws_assume_role_arn: "arn:aws:iam::022499044898:role/CrossAccountMasterRole"

# Lex bot configuration
bot_id: "7U02QDX2GI"
#bot_name: "WMZQH0M4SQ-importado"
role_arn: "arn:aws:iam::743065069150:role/poc-role-amazon-lex-sameque-mendes"
var_file: "variables/hml.tfvars"

# GitHub repository configuration
github_repo_url: "https://github.com/samequemendes/amazon-lex-v2-example.git"
github_repo_url_fallback: "git@github.com:samequemendes/amazon-lex-v2-example.git"
branch_repo: "main"

# Terraform configuration
local_clone_path: "./terraform-repo"
fallback_clone_path: "./terraform-repo-fallback"
backend_bucket: "samequemendes-terraform-tf-states"
backend_key: "amazon-lex/terraform.tfstate"
backend_region: "us-east-1"
