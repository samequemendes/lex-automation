# Configuration variables for Terraform automation with Amazon Lex

### Variaveis Gerais
# Variáveis gerais para o projeto
region: "us-east-1"
environment: "hml" # Input de dado
env: "hml" # Input de dado


### Configurações para AWS
# Configurações Cross Account
project_name: "amazon-lex-automation" # Input de dado
aws_assume_role_arn: "arn:aws:iam::022499044898:role/CrossAccountMasterRole"
dest_aws_assume_role_arn: "arn:aws:iam::022499044898:role/CrossAccountMasterRole"
orig_account_id: "022499044898"
dest_account_id: "743065069150"
role_name: "CrossAccountMasterRole"
prefix_iam: "arn:aws:iam::"

dest_account: "{{ prefix_iam + dest_account_id + role_name}}"
dest_account_role_arn: "{{ prefix_iam }}{{ dest_account_id }}:role/{{ role_name }}"
orig_account_role_arn: "{{ prefix_iam }}{{ orig_account_id }}:role/{{ role_name }}"
### Lex bot settings
# Lex bot configuration para migração

bot_id: "WPSVZVLS93" # Input de dado {ID do Bot que deseja importar}
bot_import_name: "{{ bot_name + bot_id + alias_importado }}" # Input de dado {Nome do Bot que deseja importar}
role_arn: "arn:aws:iam::022499044898:role/CrossAccountMasterRole" # Assumir a Role criada na conta destino {Sugiro criar expressão para gerar a role de acordo com o id da conta}
bot_name: "Bot-automatizado" # Input de dado {Nome do Bot que deseja importar}
lambda_function_arn: "arn:aws:lambda:us-east-1:022499044898:function:lambda-agendamento-console" # Input de dado {ARN da função Lambda que será associada ao bot}
alias_name: "{{ env }}"
bot_version: "DRAFT" # Input de dado {Versão do Bot que deseja importar}
dest_role_bot_arn: "arn:aws:iam::743065069150:role/poc-role-amazon-lex-sameque-mendes" # Input de dado {ARN da função Lambda que será associada ao bot na conta destino}
alias_importado: "importado"
### GitHub repository configuration
# Link do repositório GitHub e Repositório de fallback
github_repo_url: "https://github.com/samequemendes/amazon-lex-v2-example.git" # Input de dado {URL do repositório GitHub que contém o código terraform}
github_repo_url_fallback: "git@github.com:samequemendes/amazon-lex-v2-example.git"
branch_repo: "main" # Input de dado {Sugiro criar opção de versão do branch para futuras versões do bot}

### Terraform configuration
# Configurações de backend - versão - backend - variables
local_clone_path: "./terraform-repo"
fallback_clone_path: "./terraform-repo-fallback"
backend_bucket: "its-on-terraform-tf-states"
backend_key: "terraform-states/lexv2/terraform.tfstate"
backend_region: "us-east-1"
var_file: "./variables/hml.tfvars" # Variáveis do bot
