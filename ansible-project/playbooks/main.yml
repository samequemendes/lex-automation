---
- name: Playbook modular com roles especializadas
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    github_repo_url: "https://github.com/sua-conta/seu-repo.git"
    local_clone_path: "/tmp/repositorio-clonado"
    aws_profile: "default"
    aws_region: "us-east-1"

  roles:
    - role: github_checkout
    - role: aws_auth
    - role: terraform_exec
    - role: resumo_final
